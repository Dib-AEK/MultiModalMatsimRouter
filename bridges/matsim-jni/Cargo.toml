# Builds the small JNI boundary; the routing library remains independent of Java.
[package]
name = "matsim-pt-router-jni"
version = "0.1.0"
edition = "2024"

[lib]
name = "matsim_pt_router"
crate-type = ["cdylib", "rlib"]

[dependencies]
multimodal-matsim-router = { path = "../.." }
anyhow = "1"
jni = "0.21.1"
serde_json = "1"
mmrouter-service = { path = "../router-service" }
